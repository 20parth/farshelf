<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8a7d"/>
      <stop offset="1" stop-color="#14443e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7cf7a"/>
      <stop offset="1" stop-color="#e3a43f"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#eadfc8"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#06201d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>
  <!-- cloud: the far shelf -->
  <path d="M640 330c0-52 42-94 94-94 44 0 81 30 91 71 37 4 66 36 66 74 0 41-33 74-74 74H662c-45 0-81-36-81-81 0-41 30-75 69-80z" fill="#fffaf0" opacity="0.92" filter="url(#soft)" transform="translate(-40 -24) scale(0.82) translate(160 40)"/>
  <!-- items on the shelf -->
  <g filter="url(#soft)">
    <rect x="232" y="452" width="176" height="200" rx="26" fill="url(#amber)"/>
    <rect x="262" y="500" width="116" height="20" rx="10" fill="#b9771e" opacity="0.55"/>
    <rect x="438" y="498" width="88" height="154" rx="18" fill="url(#cream)"/>
    <rect x="548" y="420" width="88" height="232" rx="18" fill="url(#cream)" transform="rotate(7 592 652)"/>
    <rect x="676" y="540" width="116" height="112" rx="22" fill="#9fd6cb"/>
  </g>
  <!-- the shelf -->
  <g filter="url(#soft)">
    <rect x="196" y="652" width="632" height="54" rx="27" fill="url(#cream)"/>
    <rect x="252" y="700" width="40" height="112" rx="20" fill="#eadfc8"/>
    <rect x="732" y="700" width="40" height="112" rx="20" fill="#eadfc8"/>
  </g>
</svg>
