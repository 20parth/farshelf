name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security impact
      description: Does this send data anywhere new, need new permissions, or touch encryption?
  - type: checkboxes
    id: check
    attributes:
      label: Checks
      options:
        - label: I checked the roadmap (docs/ROADMAP.md) and existing issues
          required: true
