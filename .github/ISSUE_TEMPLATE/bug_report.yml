name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Thanks! Please remove tokens, passwords and private file names. Security issues: use private reporting (see SECURITY.md).'
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Farshelf version / commit
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Node version
      placeholder: 'macOS 15.2, Node 22.18.0'
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Storage type
      options: [Local folder, WebDAV / Nextcloud, Google Drive, Not storage-related]
      multiple: true
  - type: checkboxes
    id: flags
    attributes:
      label: Context
      options:
        - label: The storage is encrypted
        - label: AI features are enabled
        - label: Accessed through a mounted drive (WebDAV) rather than the web UI
  - type: textarea
    id: logs
    attributes:
      label: Relevant Activity entries or terminal output
      render: text
