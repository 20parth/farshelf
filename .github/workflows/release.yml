name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Pack
        run: |
          npm pack
          sha256sum farshelf-*.tgz > SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" farshelf-*.tgz SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Install with: npm install -g farshelf-${GITHUB_REF_NAME#v}.tgz"
